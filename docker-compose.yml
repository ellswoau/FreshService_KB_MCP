# freshservice-kb - Docker Compose.
#
# Two services from one image:
#   updater  - the 4-hourly pipeline that keeps Azure AI Search fresh (default)
#   mcp      - the retrieval MCP server Axle calls on a ticket (opt-in)
#
# Copy .env.example to .env and fill it in first. NEVER commit .env.
#
#   docker compose up -d updater          # just the updater
#   docker compose --profile mcp up -d    # updater + MCP server

services:
  updater:
    build: .
    image: freshservice-kb:latest
    container_name: freshservice-kb-updater
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /data/.state
      INTERVAL_HOURS: "${INTERVAL_HOURS:-4}"
      RECONCILE_HOUR_UTC: "${RECONCILE_HOUR_UTC:-3}"
      RUN_AT_START: "${RUN_AT_START:-true}"
    volumes:
      # Watermark persists across restarts/rebuilds.
      - fskb-state:/data
      # Optional: a feedback-derived boost table the MCP server also reads.
      - ./feedback:/app/feedback:ro

  mcp:
    build: .
    image: freshservice-kb:latest
    container_name: freshservice-kb-mcp
    restart: unless-stopped
    profiles: ["mcp"]
    command: ["fskb-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8014"]
    env_file: .env
    environment:
      KB_MCP_AUTH_TOKEN: "${KB_MCP_AUTH_TOKEN:?set this to a strong random value}"
      KB_BOOST_PATH: /app/feedback/boost.json
    ports:
      - "8014:8014"
    volumes:
      - ./feedback:/app/feedback:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health', timeout=6).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  fskb-state:
