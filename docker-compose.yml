# freshservice-kb - Docker Compose.
#
# Two long-running services from one image, both restart-on-failure and
# start-on-boot (given `systemctl enable docker` on the host):
#   updater  - the 4-hourly pipeline that keeps Azure AI Search fresh
#   mcp      - the retrieval MCP server Axle calls on a ticket
#
# Copy .env.example to .env and fill it in first. NEVER commit .env.
#
#   docker compose up -d          # starts BOTH services
#   docker compose logs -f        # follow both

services:
  updater:
    build: .
    image: freshservice-kb:latest
    container_name: freshservice-kb-updater
    # Restart on crash and after a host reboot. `always` would also restart
    # after an explicit `docker stop`; `unless-stopped` respects a manual stop.
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /data/.state
      INTERVAL_HOURS: "${INTERVAL_HOURS:-4}"
      RECONCILE_HOUR_UTC: "${RECONCILE_HOUR_UTC:-3}"
      RUN_AT_START: "${RUN_AT_START:-true}"
    volumes:
      # Watermark persists across restarts/rebuilds.
      - fskb-state:/data
      # Optional: a feedback-derived boost table the MCP server also reads.
      - ./feedback:/app/feedback:ro
    healthcheck:
      # This service maintains the watermark; its presence proves a run happened.
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists(os.environ.get('STATE_DIR','/data/.state')+'/state.json') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    build: .
    image: freshservice-kb:latest
    container_name: freshservice-kb-mcp
    restart: unless-stopped
    command: ["fskb-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8014"]
    env_file: .env
    environment:
      # Required: bearer token gating the MCP endpoint. Set it in .env.
      KB_MCP_AUTH_TOKEN: "${KB_MCP_AUTH_TOKEN}"
      KB_BOOST_PATH: /app/feedback/boost.json
    ports:
      - "8014:8014"
    volumes:
      - ./feedback:/app/feedback:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health', timeout=6).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  fskb-state:
